.bg{fill:var(--bg)}
.shadow-flood{flood-color:var(--shadow);flood-opacity:var(--shadow-op)}
.glow-flood{flood-color:var(--red);flood-opacity:.9}
.anim{animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.anim{animation-play-state:paused}}
.bar{animation-duration:20s;fill:var(--ink);filter:url(#shadow)}
