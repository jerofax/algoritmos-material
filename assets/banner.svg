<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Ordenando paso a paso</title>
<desc id="desc">Dieciséis barras desordenadas. Se ordenan por inserción con intercambios entre vecinas; la barra que se mueve se marca en rojo y al final se recorre el arreglo ya ordenado.</desc>
<defs>
<filter id="shadow" x="-100%" y="-100%" width="300%" height="300%">
<feGaussianBlur in="SourceAlpha" stdDeviation="3.5"/><feOffset dy="3" result="b"/>
<feFlood class="shadow-flood"/><feComposite in2="b" operator="in"/>
<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
<feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
<feFlood class="glow-flood"/><feComposite in2="b" operator="in" result="g"/>
<feOffset in="g" dy="2" result="g2"/>
<feMerge><feMergeNode in="g2"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
